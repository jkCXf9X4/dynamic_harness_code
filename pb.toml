# pb.toml — breakdown-local overrides. Defaults apply otherwise (templates/pb.toml).

[layout]
# The installed skill bundles are reference material, not breakdown nodes.
# Runtime/venv directories are not breakdown state and would otherwise trip
# the leaf front-matter checks (generated artifacts, vendored docs).
exclude_dirs = [".agents", ".dhc", ".dynamic-harness", ".venv", ".pytest_cache", "src", "tests", "examples"]
# The breakdown root is the repo root itself: record `artifacts:` resolve
# against it (src/, tests/, examples/ live here, not in a parent).
repo_root = "."
# Cold-storage decision archive (primary model): records at the zip root,
# tombstones under its deprecated/ namespace, reached only via `pb archive`.
archive = "docs/archive/archive.zip"

[nodes]
# AGENTS.md is agent-harness configuration at the root, not a leaf.
exempt = ["AGENTS.md"]

[ids]
# Planned handles cited by leaves before their own leaf/record files land.
reserved_ids = []
